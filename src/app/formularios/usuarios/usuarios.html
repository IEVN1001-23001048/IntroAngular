<div style="text-align: center; margin-top: 50px; font-family: Arial;">
    <h2>Iniciar Sesión</h2>
    
    <label>Usuario:</label><br>
    <input type="text" #usuario placeholder="Escribe tu usuario" style="margin-bottom: 10px;"><br>

    <label>Contraseña:</label><br>
    <input type="password" #contrasena placeholder="Escribe tu contraseña" style="margin-bottom: 15px;"><br>

    <button (click)="validarUsuario(usuario.value, contrasena.value)">Entrar</button>
</div>
